<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Card Designer (Streamlit CCv2 source)</title>
<style>
.cd-root {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    background: #f8fafc;
    direction: rtl;
    color: #1e293b;
}
.cd-root #hint {
    padding: 6px 10px; font-size: 12px; color: #475569; text-align: center;
    background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; margin-bottom: 8px;
}
.cd-root #stage { position: relative; display: inline-block; max-width: 100%; user-select: none; touch-action: none; }
.cd-root #stage img { display: block; width: 100%; height: auto; border-radius: 8px; pointer-events: auto; }
.cd-root .rect {
    position: absolute; border: 2px dashed #2563eb; background: rgba(37, 99, 235, 0.12);
    cursor: move; box-sizing: border-box;
}
.cd-root .rect.active { border-color: #dc2626; border-style: solid; background: rgba(220, 38, 38, 0.12); }
.cd-root .rect .lbl {
    position: absolute; top: -20px; right: 0; font-size: 11px; color: #1d4ed8;
    font-weight: 700; white-space: nowrap; background: rgba(255,255,255,0.85);
    padding: 0 4px; border-radius: 4px;
}
.cd-root .handle {
    position: absolute; width: 14px; height: 14px; background: #2563eb;
    border: 2px solid #fff; border-radius: 50%; left: -8px; bottom: -8px; cursor: nwse-resize;
}
.cd-root #ghost {
    position: absolute; border: 2px dashed #16a34a; background: rgba(22, 163, 74, 0.12);
    display: none; pointer-events: none; box-sizing: border-box;
}
</style>
</head>
<body>
<div id="hint">🖱️ اسحب على الصورة لرسم مكان العنصر المختار &bull; اسحب المستطيل لتحريكه &bull; الدائرة الزرقاء لتغيير الحجم</div>
<div id="stage">
    <img id="img" draggable="false" alt="">
    <div id="ghost"></div>
</div>
<script>
export default function (component) {
    const { data, parentElement, setTriggerValue } = component;

    // ===== Build the UI inside the component root (Shadow DOM) =====
    const root = document.createElement("div");
    root.className = "cd-root";
    parentElement.appendChild(root);
    root.innerHTML =
        '<div id="hint">🖱️ اسحب على الصورة لرسم مكان العنصر المختار &bull; اسحب المستطيل لتحريكه &bull; الدائرة الزرقاء لتغيير الحجم</div>' +
        '<div id="stage">' +
        '<img id="img" draggable="false" alt="">' +
        '<div id="ghost"></div>' +
        '</div>';

    const img = root.querySelector("#img");
    const stage = root.querySelector("#stage");
    const ghost = root.querySelector("#ghost");

    let elements = (data && data.elements) || {};
    let labels = (data && data.labels) || {};
    let selectedKey = (data && data.selected_key) || "";
    if (data && data.image) img.src = data.image;

    let mode = null;          // "draw" | "move" | "resize"
    let dragKey = null;
    let dragEl = null;
    let sx = 0, sy = 0;
    let orig = null;
    let curRect = null;
    let moved = false;

    function emit(payload) {
        setTriggerValue("action", payload);
    }

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }

    function rel(e) {
        const r = img.getBoundingClientRect();
        return {
            x: (e.clientX - r.left) / r.width,
            y: (e.clientY - r.top) / r.height
        };
    }

    function applyStyle(el, rect) {
        el.style.left = (rect.x * 100) + "%";
        el.style.top = (rect.y * 100) + "%";
        el.style.width = (rect.w * 100) + "%";
        el.style.height = (rect.h * 100) + "%";
    }

    function renderRects() {
        const olds = stage.querySelectorAll(".rect");
        for (let i = 0; i < olds.length; i++) olds[i].remove();
        Object.keys(elements).forEach(function (k) {
            const s = elements[k];
            if (!s || typeof s.x !== "number") return;
            const d = document.createElement("div");
            d.className = "rect" + (k === selectedKey ? " active" : "");
            applyStyle(d, s);
            const lbl = document.createElement("span");
            lbl.className = "lbl";
            lbl.textContent = labels[k] || k;
            d.appendChild(lbl);
            const hd = document.createElement("div");
            hd.className = "handle";
            hd.addEventListener("mousedown", function (ev) {
                ev.stopPropagation(); ev.preventDefault();
                startDrag(ev, k, "resize", d);
            });
            d.appendChild(hd);
            d.addEventListener("mousedown", function (ev) {
                ev.stopPropagation(); ev.preventDefault();
                startDrag(ev, k, "move", d);
            });
            stage.appendChild(d);
        });
    }

    function startDrag(ev, key, m, el) {
        mode = m; dragKey = key; dragEl = el; moved = false;
        const p = rel(ev);
        sx = p.x; sy = p.y;
        orig = Object.assign({}, elements[key]);
        curRect = null;
    }

    function onMouseDown(ev) {
        // Only start drawing when clicking the image itself (not an existing rect)
        if (ev.target !== img) return;
        if (!selectedKey) return;
        mode = "draw"; dragKey = selectedKey; dragEl = null; moved = false;
        const p = rel(ev);
        sx = p.x; sy = p.y;
        curRect = { x: sx, y: sy, w: 0, h: 0 };
        ghost.style.display = "block";
        applyStyle(ghost, curRect);
        ev.preventDefault();
    }

    function onMouseMove(ev) {
        if (!mode) return;
        const p = rel(ev);
        moved = true;
        if (mode === "draw") {
            curRect = {
                x: Math.min(sx, p.x), y: Math.min(sy, p.y),
                w: Math.abs(p.x - sx), h: Math.abs(p.y - sy)
            };
            applyStyle(ghost, curRect);
        } else if (mode === "move" && orig) {
            curRect = {
                x: clamp01(orig.x + (p.x - sx)),
                y: clamp01(orig.y + (p.y - sy)),
                w: orig.w, h: orig.h
            };
            if (dragEl) applyStyle(dragEl, curRect);
        } else if (mode === "resize" && orig) {
            curRect = {
                x: orig.x, y: orig.y,
                w: Math.max(0.005, p.x - orig.x),
                h: Math.max(0.005, p.y - orig.y)
            };
            if (dragEl) applyStyle(dragEl, curRect);
        }
    }

    function onMouseUp() {
        if (!mode) return;
        ghost.style.display = "none";
        if (mode === "draw") {
            if (curRect && curRect.w > 0.005 && curRect.h > 0.005) {
                emit({ action: "update", key: dragKey, rect: curRect });
            }
        } else if (!moved) {
            // Simple click on an existing element => select it
            emit({ action: "select", key: dragKey });
        } else if (curRect) {
            emit({ action: "update", key: dragKey, rect: curRect });
        }
        mode = null; dragKey = null; dragEl = null; orig = null; curRect = null;
    }

    function onImgLoad() { renderRects(); }

    stage.addEventListener("mousedown", onMouseDown);
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);
    img.addEventListener("load", onImgLoad);
    if (img.complete && img.naturalWidth > 0) renderRects();

    // Cleanup when Streamlit unmounts / re-renders the component
    return function cleanup() {
        stage.removeEventListener("mousedown", onMouseDown);
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
        img.removeEventListener("load", onImgLoad);
        if (root.parentNode) root.parentNode.removeChild(root);
    };
}
</script>
</body>
</html>

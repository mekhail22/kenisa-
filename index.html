<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
    body { margin: 0; font-family: 'Cairo', sans-serif; background: #f8fafc; direction: rtl; }
    #hint {
        padding: 6px 10px; font-size: 12px; color: #475569; text-align: center;
        background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; margin-bottom: 8px;
    }
    #stage { position: relative; display: inline-block; max-width: 100%; user-select: none; touch-action: none; }
    #stage img { display: block; width: 100%; height: auto; border-radius: 8px; pointer-events: auto; }
    .rect {
        position: absolute; border: 2px dashed #2563eb; background: rgba(37, 99, 235, 0.12);
        cursor: move; box-sizing: border-box;
    }
    .rect.active { border-color: #dc2626; border-style: solid; background: rgba(220, 38, 38, 0.12); }
    .rect .lbl {
        position: absolute; top: -20px; right: 0; font-size: 11px; color: #1d4ed8;
        font-weight: 700; white-space: nowrap; background: rgba(255,255,255,0.85);
        padding: 0 4px; border-radius: 4px;
    }
    .handle {
        position: absolute; width: 14px; height: 14px; background: #2563eb;
        border: 2px solid #fff; border-radius: 50%; left: -8px; bottom: -8px; cursor: nwse-resize;
    }
    #ghost {
        position: absolute; border: 2px dashed #16a34a; background: rgba(22, 163, 74, 0.12);
        display: none; pointer-events: none; box-sizing: border-box;
    }
</style>
</head>
<body>
<div id="hint">🖱️ اسحب على الصورة لرسم مكان العنصر المختار &bull; اسحب المستطيل لتحريكه &bull; الدائرة الزرقاء لتغيير الحجم</div>
<div id="stage">
    <img id="img" draggable="false" alt="">
    <div id="ghost"></div>
</div>
<script>
(function () {
    var img = document.getElementById("img");
    var stage = document.getElementById("stage");
    var ghost = document.getElementById("ghost");
    var props = {};
    var elements = {};
    var labels = {};
    var selectedKey = "";
    var mode = null;          // "draw" | "move" | "resize"
    var dragKey = null;
    var dragEl = null;
    var sx = 0, sy = 0;
    var orig = null;
    var curRect = null;
    var moved = false;

    function send(type, data) {
        var out = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
        window.parent.postMessage(out, "*");
    }
    function setFrameHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

    // Component handshake
    send("streamlit:componentReady", { apiVersion: 1 });

    window.addEventListener("message", function (ev) {
        if (!ev.data || ev.data.type !== "streamlit:render") return;
        props = ev.data.args || {};
        elements = {};
        try { elements = JSON.parse(props.elements_json || "{}") || {}; } catch (e) { elements = {}; }
        labels = {};
        try { labels = JSON.parse(props.labels_json || "{}") || {}; } catch (e) { labels = {}; }
        selectedKey = props.selected_key || "";
        if (props.image && img.getAttribute("src") !== props.image) {
            img.src = props.image;
        }
        renderRects();
        setFrameHeight(document.body.scrollHeight + 6);
    });
    img.addEventListener("load", function () {
        renderRects();
        setFrameHeight(document.body.scrollHeight + 6);
    });

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }

    function rel(e) {
        var r = img.getBoundingClientRect();
        return {
            x: (e.clientX - r.left) / r.width,
            y: (e.clientY - r.top) / r.height
        };
    }

    function applyStyle(el, rect) {
        el.style.left = (rect.x * 100) + "%";
        el.style.top = (rect.y * 100) + "%";
        el.style.width = (rect.w * 100) + "%";
        el.style.height = (rect.h * 100) + "%";
    }

    function renderRects() {
        var olds = stage.querySelectorAll(".rect");
        for (var i = 0; i < olds.length; i++) olds[i].remove();
        Object.keys(elements).forEach(function (k) {
            var s = elements[k];
            if (!s || typeof s.x !== "number") return;
            var d = document.createElement("div");
            d.className = "rect" + (k === selectedKey ? " active" : "");
            applyStyle(d, s);
            var lbl = document.createElement("span");
            lbl.className = "lbl";
            lbl.textContent = labels[k] || k;
            d.appendChild(lbl);
            var hd = document.createElement("div");
            hd.className = "handle";
            hd.addEventListener("mousedown", function (ev) {
                ev.stopPropagation(); ev.preventDefault();
                startDrag(ev, k, "resize", d);
            });
            d.appendChild(hd);
            d.addEventListener("mousedown", function (ev) {
                ev.stopPropagation(); ev.preventDefault();
                startDrag(ev, k, "move", d);
            });
            stage.appendChild(d);
        });
    }

    function startDrag(ev, key, m, el) {
        mode = m; dragKey = key; dragEl = el; moved = false;
        var p = rel(ev);
        sx = p.x; sy = p.y;
        orig = Object.assign({}, elements[key]);
        curRect = null;
    }

    stage.addEventListener("mousedown", function (ev) {
        // Only start drawing when clicking the image itself (not an existing rect)
        if (ev.target !== img) return;
        if (!selectedKey) return;
        mode = "draw"; dragKey = selectedKey; dragEl = null; moved = false;
        var p = rel(ev);
        sx = p.x; sy = p.y;
        curRect = { x: sx, y: sy, w: 0, h: 0 };
        ghost.style.display = "block";
        applyStyle(ghost, curRect);
        ev.preventDefault();
    });

    document.addEventListener("mousemove", function (ev) {
        if (!mode) return;
        var p = rel(ev);
        moved = true;
        if (mode === "draw") {
            curRect = {
                x: Math.min(sx, p.x), y: Math.min(sy, p.y),
                w: Math.abs(p.x - sx), h: Math.abs(p.y - sy)
            };
            applyStyle(ghost, curRect);
        } else if (mode === "move" && orig) {
            curRect = {
                x: clamp01(orig.x + (p.x - sx)),
                y: clamp01(orig.y + (p.y - sy)),
                w: orig.w, h: orig.h
            };
            if (dragEl) applyStyle(dragEl, curRect);
        } else if (mode === "resize" && orig) {
            curRect = {
                x: orig.x, y: orig.y,
                w: Math.max(0.005, p.x - orig.x),
                h: Math.max(0.005, p.y - orig.y)
            };
            if (dragEl) applyStyle(dragEl, curRect);
        }
    });

    document.addEventListener("mouseup", function () {
        if (!mode) return;
        ghost.style.display = "none";
        if (mode === "draw") {
            if (curRect && curRect.w > 0.005 && curRect.h > 0.005) {
                send("streamlit:setComponentValue", { value: { action: "update", key: dragKey, rect: curRect } });
            }
        } else if (!moved) {
            // Simple click on an existing element => select it
            send("streamlit:setComponentValue", { value: { action: "select", key: dragKey } });
        } else if (curRect) {
            send("streamlit:setComponentValue", { value: { action: "update", key: dragKey, rect: curRect } });
        }
        mode = null; dragKey = null; dragEl = null; orig = null; curRect = null;
    });
})();
</script>
</body>
</html>
